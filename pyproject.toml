[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rrun-engine"
version = "0.1.0"
description = "R-Run — one-command hosting & hot-swap serving engine for HuggingFace models. Sibling of R-Build v2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.9"]
hf = ["transformers>=4.45", "torch>=2.3", "accelerate>=0.30"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rrun = "rrun.cli:main"

[tool.setuptools.packages.find]
include = ["rrun*"]
